name: Build and Release VirtualSofa

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    env:
      Project_Path: WPFUI_NEW/WPFUI_NEW.csproj
      App_Name: VirtualSofa

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 1. Build ra nhiều file (exe + dll) vào thư mục ./publish
    # Đã bỏ tham số PublishSingleFile
    - name: Publish Multi-File
      run: |
        dotnet publish ${{ env.Project_Path }} -c Release -r win-x64 --self-contained true -p:AssemblyName=${{ env.App_Name }} -o ./publish

    # 2. Nén toàn bộ thư mục ./publish thành file VirtualSofa.zip
    # Dùng PowerShell có sẵn, không cần action bên ngoài
    - name: Zip Release
      run: |
        powershell Compress-Archive -Path ./publish/* -DestinationPath ./${{ env.App_Name }}.zip

    # 3. Tạo Release và upload file zip
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./${{ env.App_Name }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}