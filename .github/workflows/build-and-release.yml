name: Build and Release VirtualSofa

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Chỉ tạo Release khi push tag (ví dụ: v1.0.0)
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    env:
      Project_Path: WPFUI_NEW/WPFUI_NEW.csproj
      # Tên App bạn muốn
      App_Name: VirtualSofa

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x # Chỉnh lại phiên bản .NET nếu cần (6.0.x, 7.0.x...)

    # Build và đổi tên file output thành VirtualSofa.exe ngay trong lệnh publish
    - name: Publish Single File
      run: |
        dotnet publish ${{ env.Project_Path }} -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:AssemblyName=${{ env.App_Name }} -o ./publish

    # Tạo Release và chỉ upload các file có trong folder publish (ở đây là file .exe)
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/${{ env.App_Name }}.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}