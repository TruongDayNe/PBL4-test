# IMPORTANT: Cấp quyền ghi để GitHub Action có thể tạo Release
name: Build and Release

on:
  push:
    branches: [ "main" ] 
    tags:
      - 'v*' 
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      Solution_Name: RealTimeUdpStream.sln
      Project_Path: WPFUI_NEW/WPFUI_NEW.csproj
      # Tên file zip
      Zip_Name: VirtualSofa.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    #Cài đặt môi trường
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x # Chỉnh lại version phù hợp

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # Build Solution (Để xử lý phần .NET Framework) 
    - name: Restore NuGet packages
      run: nuget restore ${{ env.Solution_Name }}

    - name: Build Solution
      run: msbuild ${{ env.Solution_Name }} /p:Configuration=Release /p:Platform="Any CPU"

    # Publish App & Tạo Zip
    
    # Publish ra thư mục riêng (./publish_output)
    - name: Publish WPF App
      run: |
        dotnet publish ${{ env.Project_Path }} `
        -c Release `
        -r win-x64 `
        --self-contained true `
        -p:PublishSingleFile=true `
        -p:IncludeNativeLibrariesForSelfExtract=true `
        --output ./publish_output

    # Nén Zip: Chỉ lấy nội dung BÊN TRONG folder publish_output
    # Dùng Compress-Archive với dấu * để lấy files bên trong, không lấy folder mẹ
    - name: Zip Release Content
      run: |
        Compress-Archive -Path .\publish_output\* -DestinationPath ./${{ env.Zip_Name }}

    # Tạo GitHub Release
    
    # Chỉ chạy bước này khi bạn push một Tag (ví dụ: v1.0.x)
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        # Tên file muốn upload lên release
        files: ${{ env.Zip_Name }}
        # Tự động ghi chú release dựa trên commit message (tuỳ chọn)
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}